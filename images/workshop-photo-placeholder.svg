<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e8dd"/>
      <stop offset="1" stop-color="#e3d5bf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect y="640" width="1200" height="160" fill="#cbb89b"/>
  <line x1="0" y1="640" x2="1200" y2="640" stroke="#6b3410" stroke-width="4" opacity="0.5"/>
  <!-- workbench -->
  <g stroke="#6b3410" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 480 h800 l-24 -24 H224 z"/>
    <path d="M280 504 v140 M920 504 v140"/>
    <path d="M310 600 h580"/>
  </g>
  <!-- timber planks leaning -->
  <g stroke="#8a5a2a" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M240 460 L380 640 M340 460 L460 640"/>
  </g>
  <!-- plank on bench -->
  <g stroke="#6b3410" stroke-width="7" fill="none" stroke-linecap="round">
    <rect x="420" y="420" width="380" height="60" rx="6"/>
  </g>
  <!-- saw hanging -->
  <g stroke="#6b3410" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1050 200 q0 -60 60 -60 q60 0 60 60 q0 70 -120 70"/>
    <path d="M1050 200 h-60 M1110 210 h-70"/>
  </g>
  <!-- chisel and mallet on bench -->
  <g stroke="#6b3410" stroke-width="5" fill="none" stroke-linecap="round">
    <rect x="560" y="470" width="90" height="18" rx="4"/>
    <rect x="680" y="458" width="45" height="30" rx="6"/>
  </g>
  <text x="600" y="750" font-family="Georgia, serif" font-size="24" fill="#8a7355" text-anchor="middle" letter-spacing="6">WORKSHOP PHOTO COMING SOON</text>
</svg>
